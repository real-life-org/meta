name: docs-kit

# Tests @real-life/docs-kit (packages/docs-kit) on every change to it.

on:
  pull_request:
    paths:
      - 'packages/docs-kit/**'
      - '.github/workflows/docs-kit.yml'
  push:
    branches: [main]
    paths:
      - 'packages/docs-kit/**'
      - '.github/workflows/docs-kit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/docs-kit/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: No known vulnerability in the dependency tree
        run: npm run audit
      - name: The tarball holds only README, package.json and src
        run: npm run check:pack
