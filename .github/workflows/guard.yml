name: guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the term register
        run: python3 scripts/guard.py
      - name: Views are up to date
        run: |
          python3 scripts/render.py
          git diff --exit-code -- views/
