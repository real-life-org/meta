name: pins

# terms/sources.json pins each world's concept scheme to a commit, so the register describes a
# state someone checked. The pin does not follow the world: a repository can change its scheme
# and nothing here notices — the register, the views and the pages at real-life.org keep showing
# the old state, with no local change and nothing red.
#
# This job asks the three repositories once a day whether their scheme file has moved on. Three
# answers, three different things to do:
#
#   nothing drifted   close the drift issue if one is open.
#
#   drift proven      open the issue, or comment on the open one. The job stays green: drift is
#                     a finding about the world, not a broken job, and the issue carries it.
#
#   check failed      a repository could not be reached, a file could not be read, or the script
#                     itself broke. Nothing was compared, so nothing is known: never report this
#                     as drift, never close an open drift issue on it, and fail loudly — a check
#                     that cannot run is worth less than no check if it looks like a green one.
#
# It never changes a pin. Which commit the register describes is a decision, and a new scheme may
# need mappings that do not exist yet.

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pins:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Pinned concept schemes have drifted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The checker tells drift, silence and a failed check apart
        run: python3 scripts/test_check_pins.py

      - name: Do the pinned concept schemes still match their repositories?
        id: check
        run: |
          set +e
          python3 scripts/check_pins.py --verbose | tee report.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # 0 nothing drifted · 2 drift · 3 check failed · 4 both. Anything else is a crash.
          case "$STATUS" in
            0) DRIFTED=no;  FAILED=no ;;
            2) DRIFTED=yes; FAILED=no ;;
            3) DRIFTED=no;  FAILED=yes ;;
            4) DRIFTED=yes; FAILED=yes ;;
            *) echo "check_pins.py exited with $STATUS, which it never returns on purpose" >&2
               DRIFTED=no; FAILED=yes ;;
          esac
          echo "drifted=$DRIFTED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Report through the issue
        run: |
          set -euo pipefail
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" \
                     --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "${{ steps.check.outputs.drifted }}" = "yes" ]; then
            { echo "A world changed its concept scheme after the commit this repository pins."
              echo "The register, the views and the pages at real-life.org still show the pinned state."
              echo
              echo '```'; cat report.txt; echo '```'
              echo
              echo "To follow a world, set its \`ref\` in \`terms/sources.json\` to the commit named above,"
              echo "then run \`scripts/fetch_worlds.py\`, \`scripts/guard.py\` and \`scripts/render.py\`."
              echo "The guard decides whether the new scheme still fits the mappings; if it does not,"
              echo "the mappings come first and the pin stays where it is."
              if [ "${{ steps.check.outputs.failed }}" = "yes" ]; then
                echo
                echo "**Some worlds could not be checked in this run** (see the report above);"
                echo "for those, nothing is known either way."
              fi
              echo
              echo "_Checked by \`.github/workflows/pins.yml\` on $(date -u '+%Y-%m-%d %H:%M UTC')._"
            } > body.md
            if [ -n "$NUMBER" ]; then
              gh issue comment "$NUMBER" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [ "${{ steps.check.outputs.failed }}" = "yes" ]; then
            echo "The check did not complete; leaving issue ${NUMBER:-(none open)} as it is."
          elif [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "Every pinned concept scheme matches its repository again."
          fi

      - name: A check that could not run must not look green
        if: steps.check.outputs.failed == 'yes'
        run: |
          echo "At least one world could not be checked; see the report in the job summary." >&2
          exit 1
