name: theme

# Tests @real-life/starlight-theme (packages/starlight-theme) on every change to it.

on:
  pull_request:
    paths:
      - 'packages/starlight-theme/**'
      - '.github/workflows/theme.yml'
  push:
    branches: [main]
    paths:
      - 'packages/starlight-theme/**'
      - '.github/workflows/theme.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/starlight-theme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/starlight-theme/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: What would be published
        run: npm pack --dry-run
