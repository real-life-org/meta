<?xml version="1.0" encoding="UTF-8"?>
<!-- The layer picture of Real Life. Source of truth for all three sites. Bilingual source. Do not embed this file: SVG switch/systemLanguage picks the first language found anywhere in the browser list, not the preferred one. Embed layers.en.svg or layers.de.svg, built by scripts/build_layers.py. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940 450" font-family="Arial, Liberation Sans, Helvetica, sans-serif" role="img" aria-label="Left: the RLNP terms place and initiative, witnessing, circle, visibility, person and relationship. Right: the Real Life Stack with application, data and the connector socket. Below the socket, side by side: RLTP with the layers identity, encounter and relationship, access; and Supabase as one column across all three, other backends possible. Labelled edges connect each RLNP term with the layer that constructs it.">
        <rect width="940" height="450" fill="#ffffff"/>
        <defs>
          <marker id="arr-rlnp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7a4e"/></marker>
          <marker id="arr-rltp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f62c9"/></marker>
          <marker id="arr-rls" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b36b1c"/></marker>
          <marker id="arr-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
        </defs>
        <g font-size="12" fill="#1e2622">

          <!-- column heads -->
          <text x="30" y="22" font-weight="600" letter-spacing="1.5" fill="#5f6b64" font-size="11">RLNP · MEANING</text>
          <text x="520" y="22" font-weight="600" letter-spacing="1.5" fill="#5f6b64" font-size="11">STACK · CONSTRUCTION</text>
          <text x="410" y="22" text-anchor="middle" font-style="italic" fill="#5f6b64" font-size="11">Seam</text>

          <!-- RLNP terms -->
          <g>
            <rect x="30" y="40" width="270" height="52" rx="7" fill="#e6f0e7" stroke="#3f7a4e"/>
            <text x="44" y="61" font-size="13" font-weight="600" fill="#1e2622">Place · Initiative · Resource · Project</text>
            <text x="44" y="79" fill="#5f6b64" font-size="11">one thing can be all of them</text>

            <rect x="30" y="118" width="270" height="52" rx="7" fill="#e6f0e7" stroke="#3f7a4e"/>
            <text x="44" y="139" font-size="13" font-weight="600" fill="#1e2622">Witnessing · Promise · Role</text>
            <text x="44" y="157" fill="#5f6b64" font-size="11">a statement with an author, not approval</text>

            <rect x="30" y="196" width="270" height="52" rx="7" fill="#e6f0e7" stroke="#3f7a4e"/>
            <text x="44" y="217" font-size="13" font-weight="600" fill="#1e2622">Circle</text>
            <text x="44" y="235" fill="#5f6b64" font-size="11">chooses its own form and access</text>

            <rect x="30" y="274" width="270" height="52" rx="7" fill="#e6f0e7" stroke="#3f7a4e"/>
            <text x="44" y="295" font-size="13" font-weight="600" fill="#1e2622">Visibility</text>
            <text x="44" y="313" fill="#5f6b64" font-size="11">within the circle · mirrored · published</text>

            <rect x="30" y="352" width="270" height="52" rx="7" fill="#e6f0e7" stroke="#3f7a4e"/>
            <text x="44" y="373" font-size="13" font-weight="600" fill="#1e2622">Person · Relationship</text>
            <text x="44" y="391" fill="#5f6b64" font-size="11">arises from encounter</text>
          </g>

          <!-- stack layers -->
          <g>
            <rect x="520" y="40" width="302" height="56" rx="7" fill="#f7ecdd" stroke="#b36b1c"/>
            <text x="534" y="62" font-size="13" font-weight="600" fill="#1e2622">5 · Application</text>
            <text x="534" y="80" fill="#5f6b64" font-size="11">modules, views, forms</text>

            <rect x="520" y="110" width="302" height="56" rx="7" fill="#f7ecdd" stroke="#b36b1c" stroke-width="2"/>
            <text x="534" y="132" font-size="13" font-weight="600" fill="#1e2622">4 · Data</text>
            <text x="534" y="150" fill="#5f6b64" font-size="11">items · relations · schema · portability</text>

            <!-- Steckstelle -->
            <line x1="520" y1="181" x2="822" y2="181" stroke-dasharray="6 4" stroke-width="1.6" stroke="#b36b1c"/>
            <rect x="607" y="172" width="128" height="18" rx="9" fill="#ffffff" stroke="#b36b1c"/>
            <text x="671" y="185" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b36b1c">Connector = socket</text>

            <!-- RLTP fills 1–3 -->
            <rect x="520" y="196" width="220" height="56" rx="7" fill="#e5ecfa" stroke="#2f62c9"/>
            <text x="534" y="218" font-size="13" font-weight="600" fill="#1e2622">3 · Access</text>
            <text x="534" y="236" fill="#5f6b64" font-size="11">groups · policy · keys</text>

            <rect x="520" y="266" width="220" height="56" rx="7" fill="#e5ecfa" stroke="#2f62c9"/>
            <text x="534" y="288" font-size="12" font-weight="600" fill="#1e2622">2 · Encounter and Relationship</text>
            <text x="534" y="306" fill="#5f6b64" font-size="11">ceremony · trust · credentials</text>

            <rect x="520" y="336" width="220" height="56" rx="7" fill="#e5ecfa" stroke="#2f62c9"/>
            <text x="534" y="358" font-size="13" font-weight="600" fill="#1e2622">1 · Identity</text>
            <text x="534" y="376" fill="#5f6b64" font-size="11">identifiers · devices</text>

            <line x1="520" y1="404" x2="740" y2="404" stroke-width="2" stroke="#2f62c9"/>
            <text x="630" y="422" text-anchor="middle" font-weight="600" font-size="12" fill="#2f62c9">RLTP fills 1 to 3</text>
            <text x="630" y="436" text-anchor="middle" font-size="10" fill="#5f6b64">with its own guarantees per layer</text>

            <!-- other fillings: one narrow full-height column -->
            <rect x="752" y="196" width="70" height="196" rx="7" fill="none" stroke="#1e2622" stroke-opacity="0.45" stroke-dasharray="4 3"/>
            <text x="787" y="222" text-anchor="middle" font-size="11.5" font-weight="600">Supabase</text>
            <text x="787" y="238" text-anchor="middle" font-size="10" fill="#5f6b64">server</text>
            <text x="787" y="330" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5f6b64">others</text>
            <text x="787" y="343" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5f6b64">possible</text>
            <line x1="752" y1="404" x2="822" y2="404" stroke-width="1.5" stroke="#1e2622" stroke-opacity="0.45"/>
            <text x="787" y="422" text-anchor="middle" font-size="11" font-weight="600">or one backend</text>
            <text x="787" y="436" text-anchor="middle" font-size="10" fill="#5f6b64">for all three</text>

            <!-- RLS bracket: 5, 4 and the socket -->
            <line x1="838" y1="40" x2="838" y2="190" stroke-width="2" stroke="#b36b1c"/>
            <text x="847" y="110" font-weight="600" font-size="13" fill="#b36b1c">RLS</text>
            <text x="847" y="124" font-size="9.5" fill="#5f6b64">layers 4, 5</text>
            <text x="847" y="136" font-size="9.5" fill="#5f6b64">+ socket</text>
          </g>

          <!-- seams -->
          <g stroke="#3f7a4e" stroke-width="1.6" fill="none">
            <path id="s1" d="M300 66 C 420 66, 440 122, 520 122" marker-end="url(#arr-rlnp)"/>
            <path id="s2" d="M300 144 C 400 144, 440 136, 520 136" marker-end="url(#arr-rlnp)"/>
            <path id="s3" d="M300 214 C 400 214, 440 150, 520 150" marker-end="url(#arr-rlnp)"/>
            <path id="s4" d="M300 230 C 400 230, 440 214, 520 214" marker-end="url(#arr-rlnp)"/>
            <path id="s5" d="M300 300 C 400 300, 440 232, 520 232" marker-end="url(#arr-rlnp)"/>
            <path id="s6" d="M300 370 C 400 370, 440 294, 520 294" marker-end="url(#arr-rlnp)"/>
            <path id="s7" d="M300 386 C 400 386, 440 364, 520 364" marker-end="url(#arr-rlnp)"/>
          </g>
          <!-- seam labels on the curves -->
          <g class="sv-lbl" font-size="10.5" fill="#3f7a4e">
            <text dy="-4" text-anchor="middle"><textPath xlink:href="#s1" startOffset="46%">templates + facets</textPath></text>
            <text dy="-4" text-anchor="middle"><textPath xlink:href="#s2" startOffset="46%">item with author</textPath></text>
            <text dy="-4" text-anchor="middle"><textPath xlink:href="#s3" startOffset="46%">space + domain model</textPath></text>
            <text dy="-4" text-anchor="middle"><textPath xlink:href="#s4" startOffset="46%">group, log, policy</textPath></text>
            <text dy="-4" text-anchor="middle"><textPath xlink:href="#s5" startOffset="46%">home space, keys</textPath></text>
            <text dy="-4" text-anchor="middle"><textPath xlink:href="#s6" startOffset="46%">contact card, ceremony</textPath></text>
            <text dy="-4" text-anchor="middle"><textPath xlink:href="#s7" startOffset="46%">key as identifier, devices</textPath></text>
          </g>
        </g>
      </svg>
